name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck -x claude-sandbox.sh sandbox-setup.sh statusline.sh tests/helpers.bash

  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          # Write-Host is deliberate: coloured status lines for an interactive console.
          $results = Invoke-ScriptAnalyzer -Path claude-sandbox.ps1 -Severity Error, Warning `
            -ExcludeRule PSAvoidUsingWriteHost
          $results | Format-Table -AutoSize | Out-String | Write-Host
          if ($results) { exit 1 }
